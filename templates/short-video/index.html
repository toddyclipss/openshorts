<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
  <title>HyperFrames Short Video</title>
  <link rel="stylesheet" href="./styles.css">
  <!-- GSAP Engine -->
  <script src="./vendor/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="root" data-width="1080" data-height="1920">
    <!-- Base Video Layer & Camera Transforms -->
    <div id="video-container">
      <div id="video-wrapper">
        <video id="base-video" playsinline muted preload="auto"></video>
      </div>
    </div>

    <!-- Dynamic Viral Hook Headline Layer -->
    <div id="hook-wrapper" class="hook-pos-top">
      <div id="hook-box" class="hook-style-pill hook-size-M">
        <span id="hook-text"></span>
      </div>
    </div>

    <!-- Animated Subtitles Layer (Karaoke / Pop) -->
    <div id="subtitles-wrapper" class="subtitles-pos-bottom">
      <div id="subtitles-container"></div>
    </div>
  </div>

  <!-- HyperFrames Timeline Logic -->
  <script src="./timeline.js"></script>
  <script>
    // Auto-initialize when props are injected via CDP or default for dev preview
    document.addEventListener("DOMContentLoaded", async () => {
      if (window.__COMPOSITION_PROPS__) {
        await window.initHyperFramesComposition(window.__COMPOSITION_PROPS__);
      } else {
        // Fallback demo props for local scrubbing in `npx hyperframes dev`
        const demoProps = {
          videoUrl: "",
          durationInFrames: 150, // 5 seconds @ 30fps
          fps: 30,
          width: 1080,
          height: 1920,
          hook: {
            text: "THIS CHANGED EVERYTHING \uD83E\uDD2F",
            position: "top",
            size: "M",
            style: "pill",
            entranceAnimation: "spring",
            displayDurationSec: 3.5
          },
          subtitles: {
            position: "bottom",
            style: {
              fontFamily: "Montserrat-ExtraBold",
              fontSize: 72,
              fontColor: "#FFFFFF",
              highlightColor: "#FFE600",
              highlightTextColor: "#000000",
              borderColor: "#000000",
              borderWidth: 6,
              bgColor: "#000000",
              bgOpacity: 0.0,
              animation: "karaoke",
              baseOpacity: 0.4,
              uppercase: true,
              reveal: true,
              shadow: 3
            },
            captions: [
              { text: "THIS", startMs: 200, endMs: 600 },
              { text: "IS", startMs: 600, endMs: 900 },
              { text: "THE", startMs: 900, endMs: 1200 },
              { text: "NEW", startMs: 1200, endMs: 1600 },
              { text: "WAY", startMs: 1600, endMs: 2000 },
              { text: "TO", startMs: 2000, endMs: 2300 },
              { text: "RENDER", startMs: 2300, endMs: 2800 },
              { text: "VIRAL", startMs: 2800, endMs: 3300 },
              { text: "VIDEOS", startMs: 3300, endMs: 4000 }
            ]
          },
          effects: {
            segments: [
              { startSec: 0, endSec: 1.5, zoom: 1.0, zoomCenterX: 0.5, zoomCenterY: 0.4, brightness: 1.0, contrast: 1.0, saturate: 1.0 },
              { startSec: 1.5, endSec: 3.5, zoom: 1.25, zoomCenterX: 0.5, zoomCenterY: 0.38, brightness: 1.05, contrast: 1.1, saturate: 1.15, transitionSec: 0.25 },
              { startSec: 3.5, endSec: 5.0, zoom: 1.05, zoomCenterX: 0.5, zoomCenterY: 0.4, brightness: 1.0, contrast: 1.0, saturate: 1.0, transitionSec: 0.3 }
            ]
          }
        };
        await window.initHyperFramesComposition(demoProps);
      }
    });
  </script>
</body>
</html>
